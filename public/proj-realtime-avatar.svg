    <rect x="279" y="462" width="185" height="78" rx="18" fill="#ffffff" fill-opacity="0.12" stroke="#7ad9d7" stroke-opacity="0.65"/>
    <rect x="496" y="462" width="185" height="78" rx="18" fill="#ffffff" fill-opacity="0.12" stroke="#7ad9d7" stroke-opacity="0.65"/>
