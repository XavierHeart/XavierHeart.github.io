      <circle cx="517" cy="263" r="20" fill="#6c5bb5"/>
      <text x="517" y="269" fill="#ffffff" font-size="16" font-weight="700">AGENT</text>
      <text x="517" y="318" fill="#17324d" font-size="20" font-weight="700">REASONING</text>
