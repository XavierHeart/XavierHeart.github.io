<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Real-time emotional avatar video generation</title>
  <desc id="desc">A system flow from user speech through ASR, dialogue agent, emotional TTS, and autoregressive video generation.</desc>
  <defs>
    <linearGradient id="avatarBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2740"/>
      <stop offset="0.55" stop-color="#173f5f"/>
      <stop offset="1" stop-color="#0b6b70"/>
    </linearGradient>
    <linearGradient id="avatarGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58c7db"/>
      <stop offset="1" stop-color="#7fe2c5"/>
    </linearGradient>
    <filter id="avatarShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#061522" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#avatarBg)"/>
  <circle cx="1050" cy="80" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="1050" cy="80" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <text x="62" y="72" fill="#8cebd7" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="4">AIGC SYSTEM</text>
  <text x="62" y="124" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Real-Time Emotional Avatar</text>
  <text x="62" y="161" fill="#c7d9e8" font-family="Arial, Helvetica, sans-serif" font-size="21">speech - reasoning - emotion - continuous audio-driven video</text>

  <path d="M125 286h928" stroke="url(#avatarGlow)" stroke-width="4" stroke-opacity="0.65"/>
  <g filter="url(#avatarShadow)" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g>
      <rect x="58" y="226" width="150" height="122" rx="22" fill="#ffffff" fill-opacity="0.96"/>
      <circle cx="133" cy="263" r="20" fill="#1f6a8a"/>
