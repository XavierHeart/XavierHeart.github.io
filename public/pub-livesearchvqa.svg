<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">LiveSearchVQA system overview</title>
  <desc id="desc">Fresh news flows through an evidence-first generator and certification gate into diagnostic agent evaluation.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e7f7f4"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg2)"/>
  <text x="64" y="72" fill="#102a43" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">LiveSearchVQA</text>
  <text x="64" y="110" fill="#486581" font-family="Arial, Helvetica, sans-serif" font-size="22">Certifying search necessity for multimodal web-search agents</text>

  <g filter="url(#shadow2)" font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="170" width="218" height="188" rx="22" fill="#ffffff" stroke="#8fb8df" stroke-width="3"/>
    <rect x="342" y="170" width="250" height="188" rx="22" fill="#ffffff" stroke="#7da7d9" stroke-width="3"/>
    <rect x="652" y="150" width="260" height="228" rx="22" fill="#ffffff" stroke="#42a68f" stroke-width="4"/>
    <rect x="972" y="170" width="164" height="188" rx="22" fill="#173f5f"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="173" y="216" fill="#1665a7" font-size="22" font-weight="700">FRESH NEWS</text>
    <text x="173" y="258" fill="#486581" font-size="19">image + article</text>
    <text x="173" y="292" fill="#486581" font-size="19">published &lt; 48 h</text>
    <text x="173" y="326" fill="#102a43" font-size="19" font-weight="700">on-demand build</text>

    <text x="467" y="216" fill="#315e91" font-size="22" font-weight="700">GENERATOR</text>
    <text x="467" y="256" fill="#486581" font-size="18">lock verbatim evidence</text>
    <text x="467" y="288" fill="#486581" font-size="18">write image-resolved question</text>
    <text x="467" y="320" fill="#486581" font-size="18">closed-book self-check</text>

    <text x="782" y="196" fill="#1a806f" font-size="22" font-weight="700">CERTIFICATION GATE</text>
    <circle cx="712" cy="253" r="29" fill="#e7f7f4" stroke="#42a68f" stroke-width="3"/>
    <circle cx="782" cy="253" r="29" fill="#e7f7f4" stroke="#42a68f" stroke-width="3"/>
    <circle cx="852" cy="253" r="29" fill="#e7f7f4" stroke="#42a68f" stroke-width="3"/>
    <text x="712" y="261" fill="#176a5b" font-size="20" font-weight="700">P0</text>
    <text x="782" y="261" fill="#176a5b" font-size="20" font-weight="700">P1</text>
    <text x="852" y="261" fill="#176a5b" font-size="20" font-weight="700">P2</text>
    <text x="782" y="313" fill="#486581" font-size="18">grounding - necessity - sufficiency</text>
    <text x="782" y="345" fill="#102a43" font-size="18" font-weight="700">rejection-only quality authority</text>

    <text x="1054" y="216" fill="#ffffff" font-size="21" font-weight="700">CERTIFIED</text>
    <text x="1054" y="248" fill="#ffffff" font-size="21" font-weight="700">ITEM</text>
    <text x="1054" y="292" fill="#d9e9f6" font-size="17">image</text>
    <text x="1054" y="318" fill="#d9e9f6" font-size="17">question</text>
    <text x="1054" y="344" fill="#d9e9f6" font-size="17">gold evidence</text>
  </g>

  <g stroke="#52667a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M282 264h48"/><path d="M320 253l12 11-12 11"/>
    <path d="M592 264h48"/><path d="M630 253l12 11-12 11"/>
    <path d="M912 264h48"/><path d="M950 253l12 11-12 11"/>
  </g>

  <text x="64" y="436" fill="#334e68" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">DIAGNOSTIC EVALUATION</text>
  <g filter="url(#shadow2)" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="64" y="466" width="300" height="108" rx="20" fill="#ffffff" stroke="#9fb3c8" stroke-width="3"/>
    <rect x="450" y="466" width="300" height="108" rx="20" fill="#ffffff" stroke="#4c9f90" stroke-width="3"/>
    <rect x="836" y="466" width="300" height="108" rx="20" fill="#ffffff" stroke="#d49a4a" stroke-width="3"/>
    <text x="214" y="512" fill="#334e68" font-size="23" font-weight="700">CLOSED-BOOK</text>
    <text x="214" y="548" fill="#627d98" font-size="18">certified lower bound</text>
    <text x="600" y="512" fill="#1a806f" font-size="23" font-weight="700">WITH-SEARCH</text>
    <text x="600" y="548" fill="#52766f" font-size="18">agent retrieval trace</text>
    <text x="986" y="512" fill="#a45f13" font-size="23" font-weight="700">ORACLE</text>
    <text x="986" y="548" fill="#8f6a3a" font-size="18">gold-evidence upper bound</text>
  </g>
  <text x="600" y="610" fill="#486581" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">retrieval miss - distraction - evidence utilization</text>
</svg>
