<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">VIGIL method overview</title>
  <desc id="desc">Operation-matched visual evidence estimands connected to activation intervention and parameter adaptation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eaf1fb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <text x="64" y="72" fill="#102a43" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">VIGIL</text>
  <text x="64" y="110" fill="#486581" font-family="Arial, Helvetica, sans-serif" font-size="22">Causal visual-evidence dependence with operation-matched controls</text>

  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="154" width="320" height="172" rx="22" fill="#ffffff" stroke="#8fb8df" stroke-width="3"/>
    <rect x="440" y="154" width="320" height="172" rx="22" fill="#ffffff" stroke="#9a8bd6" stroke-width="3"/>
    <rect x="816" y="154" width="320" height="172" rx="22" fill="#ffffff" stroke="#59b4a5" stroke-width="3"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="224" y="205" fill="#1665a7" font-size="22" font-weight="700">EVIDENCE REMOVAL</text>
    <text x="224" y="247" fill="#486581" font-size="20">target edit - matched control</text>
    <text x="224" y="283" fill="#102a43" font-size="23" font-weight="700">LPE</text>

    <text x="600" y="205" fill="#6a54b3" font-size="22" font-weight="700">DIRECTED REPLACEMENT</text>
    <text x="600" y="247" fill="#486581" font-size="20">replacement - area control</text>
    <text x="600" y="283" fill="#102a43" font-size="23" font-weight="700">CVE</text>

    <text x="976" y="205" fill="#1a806f" font-size="22" font-weight="700">CONTEXT EDITING</text>
    <text x="976" y="247" fill="#486581" font-size="20">background - identity donor</text>
    <text x="976" y="283" fill="#102a43" font-size="23" font-weight="700">SVL</text>
  </g>

  <path d="M224 326v54h752v-54" fill="none" stroke="#627d98" stroke-width="4" stroke-linecap="round"/>
  <circle cx="600" cy="380" r="8" fill="#334e68"/>
  <path d="M600 388v52" stroke="#334e68" stroke-width="4"/>
  <path d="M589 427l11 15 11-15" fill="none" stroke="#334e68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="414" fill="#334e68" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle">shared behavioral endpoints</text>

  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="150" y="466" width="390" height="112" rx="22" fill="#173f5f"/>
    <rect x="660" y="466" width="390" height="112" rx="22" fill="#2d6a63"/>
    <text x="345" y="514" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle">ACTIVATION INTERVENTION</text>
    <text x="345" y="550" fill="#d9e9f6" font-size="19" text-anchor="middle">sensitivity and clean-state restoration</text>
    <text x="855" y="514" fill="#ffffff" font-size="24" font-weight="700" text-anchor="middle">PARAMETER ADAPTATION</text>
    <text x="855" y="550" fill="#d6f0eb" font-size="19" text-anchor="middle">localization-prioritized vs remote control</text>
  </g>
  <path d="M552 522h94" stroke="#7b8794" stroke-width="4" stroke-dasharray="10 10"/>
  <text x="600" y="507" fill="#52667a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">TRANSFER?</text>
